name: e2e

# test/e2e/run on GitHub's own runners: rootless Podman and Docker, each on
# Ubuntu 24.04 (Podman 4.9, Docker 28) and 26.04 (Podman 5.7, Docker 29).
# Both images are named, not ubuntu-latest, so both engine generations users
# meet stay tested and a move of that label cannot change what runs here.

on:
  push:
  pull_request:
  # The release workflow proves every release with this suite, castra coming
  # from the published release through mise on fresh runners instead of a build
  # of the commit. By hand:
  #   gh workflow run e2e.yml --ref vX.Y.Z -f release=vX.Y.Z
  workflow_call:
    inputs:
      release:
        description: a release tag to install with mise and test, such as v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release:
        description: a release tag to install with mise and test, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        engine: [podman, docker]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.release == ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install the devcontainer CLI the way the README tells users
        run: npm install -g @devcontainers/cli
      - name: Install sshd, which the suite starts as the runner user
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get install -yq openssh-server
      - name: Build castra
        if: inputs.release == ''
        run: CGO_ENABLED=0 go build -trimpath -o dist/castra .
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        if: inputs.release != ''
        with:
          install: false
          cache: false # a cached install would hide whether a fresh one works
      - name: Install castra from the release with mise, the way the README tells users
        if: inputs.release != ''
        env:
          RELEASE: ${{ inputs.release }}
          GITHUB_TOKEN: ${{ github.token }} # mise's GitHub API calls
          MISE_PRERELEASES: "1" # an exact version is installed, and a v*-* rehearsal release is a prerelease, which mise otherwise skips
        run: |
          mise use -g "github:${GITHUB_REPOSITORY}@${RELEASE#v}"
          castra=$(mise which castra)
          version=$("$castra" version)
          if [ "$version" != "castra $RELEASE" ]; then
            echo "::error::the release installed with mise reports \"$version\", not \"castra $RELEASE\""
            exit 1
          fi
          echo "binary: $castra"
          echo "version: $version"
          sha256sum "$castra"
          echo "CASTRA=$castra" >> "$GITHUB_ENV"
      # --strict: a check that cannot run fails instead of being skipped.
      - name: End-to-end on ${{ matrix.engine }}
        env:
          ENGINE: ${{ matrix.engine }}
        run: CASTRA="${CASTRA:-$PWD/dist/castra}" test/e2e/run --engine "$ENGINE" --strict 2>&1
